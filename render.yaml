# Render Blueprint — provisions the whole platform from this one file.
#
#   1. Push this branch to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick this repository.
#   3. Render creates the database, the key-value store, the API and the
#      scheduler, and wires the connection strings between them.
#
# Nothing here contains a credential. DATABASE_URL and REDIS_URL are injected
# from the managed services, and SECRET_KEY and ADMIN_TOKEN are generated by
# Render on first deploy. Read ADMIN_TOKEN from the dashboard afterwards --
# it is what protects POST /api/v1/admin/scrape.
#
# Both services run the same image; only the start command differs.

databases:
  - name: oumnosup-db
    databaseName: oumnosup
    user: oumnosup
    # Matches the version the schema and tests are verified against.
    postgresMajorVersion: "16"
    plan: free
    region: frankfurt

services:
  # Response cache and distributed rate limiting. Optional at runtime: without
  # it the API still serves, with caching off and per-process rate limiting.
  - name: oumnosup-cache
    type: keyvalue
    plan: free
    region: frankfurt
    ipAllowList: []          # reachable only from inside the Render network

  - name: oumnosup-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # Migrations run before the server starts, so a failed migration stops the
    # deploy instead of serving against a stale schema.
    dockerCommand: sh -c "alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oumnosup-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: oumnosup-cache
          type: keyvalue
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: API_CORS_ORIGINS
        value: '["https://oumnosup.com"]'
      # Free instances get 512 MB; a smaller pool leaves room for the 42 MB
      # dataset the scraper holds in memory during a run.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "2"

  - name: oumnosup-scheduler
    type: worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # workers have no free plan on Render
    region: frankfurt
    dockerCommand: python -m src.scheduler.tasks
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oumnosup-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: oumnosup-cache
          type: keyvalue
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # The scheduler shares the API's secrets so both refuse to boot on
      # placeholder values in production.
      - key: SECRET_KEY
        fromService:
          name: oumnosup-api
          type: web
          envVarKey: SECRET_KEY
      - key: ADMIN_TOKEN
        fromService:
          name: oumnosup-api
          type: web
          envVarKey: ADMIN_TOKEN
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "1"
