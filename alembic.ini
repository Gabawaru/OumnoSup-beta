# Alembic configuration.
#
# The database URL is deliberately absent: it is read from DATABASE_URL through
# src.core.config in alembic/env.py, so credentials live in the environment and
# never in a tracked file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Migration filenames are prefixed with a UTC timestamp so they sort
# chronologically and merge conflicts stay obvious.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
